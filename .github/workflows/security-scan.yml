name: Security scan

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  trivy_scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run trivy IaC scan (config)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'config'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  iac_checks:
    name: IaC & secrets checks (Checkov, tflint, gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    steps:
      - uses: actions/checkout@v4

      - name: Install terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform init (to make tflint happy)
        run: |
          cd tf_github || true
          terraform init -input=false || true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: 'latest'
          cache: true

      - name: Run tflint
        run: |
          cd tf_github || true
          tflint --version
          tflint --init || true
          tflint -f compact

      - name: Setup Python for checkov
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install checkov
        run: python -m pip install --upgrade pip checkov

      - name: Run checkov IaC scanning
        run: checkov -d tf_github --compact

      - name: Run gitleaks (secrets scan)
        # gitleaks v2 requires an organization license for org-owned repos. If
        # the license secret is not present, skip the gitleaks step so the job
        # doesn't fail (useful for personal accounts or when the license is not
        # yet available). See README for instructions to obtain a free org
        # license from https://gitleaks.io/ and add it to repository or org
        # secrets as `GITLEAKS_LICENSE`.
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ env.GITLEAKS_LICENSE }}
        with:
          args: '--redact'

      - name: Skip gitleaks - license missing
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        run: |
          echo "GITLEAKS_LICENSE secret missing. Skipping gitleaks-action."
          echo "If you are scanning org-owned repositories, follow README instructions to obtain and add a free license at https://gitleaks.io/"
